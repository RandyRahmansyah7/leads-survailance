name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: mkdir -p data
      - run: npm run build
      - name: shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1 && ls scripts/*.sh >/dev/null 2>&1; then
            shellcheck -S warning scripts/*.sh
          else
            echo "shellcheck skipped"
          fi
